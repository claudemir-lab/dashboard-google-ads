name: Supabase Keep-Alive

# Mantem o projeto Supabase ativo (evita a pausa automatica do plano Free) e
# tambem renova o temporizador do GitHub, que desativa workflows agendados
# apos 60 dias sem atividade no repositorio.
on:
  schedule:
    # Todos os dias as 12:00 UTC (09:00 America/Sao_Paulo)
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  actions: write   # permite reativar o proprio workflow (reset dos 60 dias)
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Renovar agendamento (evita desativacao em 60 dias)
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
          echo "Agendamento renovado."

      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL="${SUPABASE_URL%/}/rest/v1/gads_dashboard?select=data&limit=1"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "$URL" || echo "000")
          echo "HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "::warning::Ping retornou HTTP ${code}. O projeto pode estar pausado (SQL/DNS indisponivel) ou a chave incorreta."
            exit 1
          fi
          echo "Supabase ativo."
