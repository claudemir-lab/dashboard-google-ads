<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Google Ads — Neurosaber</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b1020;
    --card: #131a2e;
    --border: #232c47;
    --text: #e7eaf3;
    --muted: #8b93ab;
    --primary: #6c5ce7;
    --green: #2ecc71;
    --red: #e74c3c;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }
  header {
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:12px; margin-bottom:20px;
  }
  header h1 { font-size:22px; letter-spacing:.3px; }
  header p { color:var(--muted); font-size:13px; margin-top:4px; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; }
  .controls select, .controls button {
    background:var(--card); color:var(--text);
    border:1px solid var(--border); border-radius:8px;
    padding:8px 14px; font-size:13px; cursor:pointer;
  }
  .controls button:hover { border-color:var(--primary); }
  .grid {
    display:grid; gap:12px;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    margin-bottom:20px;
  }
  .kpi {
    background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:16px;
  }
  .kpi .label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
  .kpi .value { font-size:24px; font-weight:700; margin-top:6px; }
  .kpi .sub { font-size:12px; color:var(--muted); margin-top:4px; }
  .up { color:var(--green); }
  .down { color:var(--red); }
  .charts {
    display:grid; gap:12px;
    grid-template-columns: 1fr 1fr;
    margin-bottom:20px;
  }
  .chart-card {
    background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:16px;
  }
  .chart-card h3 { font-size:14px; margin-bottom:12px; color:var(--muted); }
  .chart-card.wide { grid-column: 1 / -1; }
  .table-wrap {
    background:var(--card); border:1px solid var(--border);
    border-radius:12px; overflow:auto;
  }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:10px 14px; text-align:right; white-space:nowrap; }
  th { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px; border-bottom:1px solid var(--border); }
  td:first-child, th:first-child { text-align:left; }
  tr:hover td { background:#182039; }
  .totals { display:flex; gap:24px; flex-wrap:wrap; padding:14px; color:var(--muted); font-size:12px; }
  .totals b { color:var(--text); }
  .loader { text-align:center; padding:60px; color:var(--muted); }
  @media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Painel Google Ads</h1>
    <p>Investimento, faturamento, ROAS e ROI por dia</p>
  </div>
  <div class="controls">
    <select id="period">
      <option value="7">Últimos 7 dias</option>
      <option value="30">Últimos 30 dias</option>
      <option value="90" selected>Últimos 90 dias</option>
      <option value="all">Todo o período</option>
    </select>
    <button onclick="loadData()">Atualizar</button>
  </div>
</header>

<div id="content" class="loader">Carregando dados...</div>

<script>
const SUPABASE_URL = "https://bbitajwmcapohixocavn.supabase.co";
const API_KEY = "sb_publishable_fNQDTEEbDQvMBbK8M4Dqeg_j-5QF2sS";

const fmtBRL = v => v.toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
const fmtInt = v => v.toLocaleString("pt-BR");
const fmtDate = iso => {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("pt-BR");
};

async function fetchRows() {
  const url = SUPABASE_URL + "/rest/v1/gads_dashboard?select=data,nome_campanha,produto_nome,investimento,faturamento,cliques,impressoes,itens_no_carrinho,quantidade_vendida,roas,roi&order=data.asc";
  const res = await fetch(url, {
    headers: {
      apikey: API_KEY,
      Authorization: "Bearer " + API_KEY,
      Accept: "application/json"
    }
  });
  if (!res.ok) throw new Error("HTTP " + res.status + " — " + await res.text());
  return res.json();
}

function filter(rows, days) {
  if (days === "all") return rows;
  const limit = new Date();
  limit.setDate(limit.getDate() - (parseInt(days,10) - 1));
  return rows.filter(r => new Date(r.data + "T00:00:00") >= limit);
}

function build(rows) {
  const inv = rows.reduce((s,r)=>s+Number(r.investimento||0),0);
  const fat = rows.reduce((s,r)=>s+Number(r.faturamento||0),0);
  const cli = rows.reduce((s,r)=>s+Number(r.cliques||0),0);
  const imp = rows.reduce((s,r)=>s+Number(r.impressoes||0),0);
  const car = rows.reduce((s,r)=>s+Number(r.itens_no_carrinho||0),0);
  const ven = rows.reduce((s,r)=>s+Number(r.quantidade_vendida||0),0);
  const roas = inv > 0 ? fat / inv : 0;
  const roi = inv > 0 ? ((fat - inv)/inv)*100 : 0;
  const ctr = imp > 0 ? (cli/imp)*100 : 0;
  const cpc = cli > 0 ? inv/cli : 0;

  const kpis = [
    { label:"Investimento", value:fmtBRL(inv), sub:"total no período" },
    { label:"Faturamento", value:fmtBRL(fat), sub:"valores de conversão" },
    { label:"ROAS", value:roas.toFixed(2)+"x", sub:"faturamento ÷ investimento", cls: roas>=1?"up":"down" },
    { label:"ROI", value:roi.toFixed(0)+"%", sub:"retorno %", cls: roi>=0?"up":"down" },
    { label:"Cliques", value:fmtInt(cli), sub:"CTR "+ctr.toFixed(2)+"%" },
    { label:"CPC médio", value:fmtBRL(cpc), sub:"custo por clique" },
    { label:"Impressões", value:fmtInt(imp), sub:"total" },
    { label:"Vendas", value:fmtInt(ven), sub:fmtInt(car)+" carrinhos" }
  ];

  document.getElementById("content").innerHTML =
    '<div class="grid">' + kpis.map(k =>
      '<div class="kpi"><div class="label">'+k.label+'</div>'+
      '<div class="value '+(k.cls||"")+'">'+k.value+'</div><div class="sub">'+k.sub+'</div></div>'
    ).join("") + '</div>' +

    '<div class="charts">' +
      '<div class="chart-card"><h3>Investimento x Faturamento (por dia)</h3><canvas id="chTrend"></canvas></div>' +
      '<div class="chart-card"><h3>ROAS por dia</h3><canvas id="chRoas"></canvas></div>' +
      '<div class="chart-card wide"><h3>Cliques e impressões (por dia)</h3><canvas id="chTraffic"></canvas></div>' +
    '</div>' +

    '<div class="table-wrap">' +
      '<table><thead><tr><th>Data</th><th>Campanha</th><th>Invest.</th><th>Fat.</th><th>ROAS</th><th>ROI</th><th>Cliques</th><th>Impr.</th><th>Vendas</th></tr></thead><tbody>' +
      [...rows].reverse().map(r =>
        '<tr><td>'+fmtDate(r.data)+'</td><td>'+r.nome_campanha+'</td>'+
        '<td>'+fmtBRL(Number(r.investimento))+'</td><td>'+fmtBRL(Number(r.faturamento))+'</td>'+
        '<td>'+Number(r.roas).toFixed(2)+'x</td><td>'+Number(r.roi).toFixed(0)+'%</td>'+
        '<td>'+fmtInt(r.cliques)+'</td><td>'+fmtInt(r.impressoes)+'</td><td>'+fmtInt(r.quantidade_vendida)+'</td></tr>'
      ).join("") +
      '</tbody></table>' +
      '<div class="totals">'+
        '<div><b>'+rows.length+'</b> dias &nbsp;·&nbsp; <b>'+fmtBRL(inv)+'</b> investido &nbsp;·&nbsp; <b>'+fmtBRL(fat)+'</b> faturado &nbsp;·&nbsp; <b>'+roas.toFixed(2)+'x</b> ROAS médio</div>'+
      '</div>' +
    '</div>';

  const days = rows.map(r => fmtDate(r.data));
  const invest = rows.map(r => r.investimento);
  const fatura = rows.map(r => r.faturamento);
  const roasArr = rows.map(r => r.roas);
  const cliques = rows.map(r => r.cliques);
  const impr = rows.map(r => r.impressoes);

  makeChart("chTrend", days, [
    { label:"Investimento", data:invest, color:"#6c5ce7", fill:true },
    { label:"Faturamento", data:fatura, color:"#2ecc71", fill:true }
  ]);
  makeChart("chRoas", days, [
    { label:"ROAS", data:roasArr, color:"#f39c12", fill:false, step:true }
  ]);
  makeChart("chTraffic", days, [
    { label:"Cliques", data:cliques, color:"#f1c40f", fill:false },
    { label:"Impressões", data:impr, color:"#3498db", fill:false }
  ], null, 2);
}

let charts = {};
function makeChart(id, labels, series, yLabel, barIdx) {
  if (charts[id]) charts[id].destroy();
  const datasets = series.map(s => ({
    label: s.label,
    data: s.data,
    borderColor: s.color,
    backgroundColor: s.fill ? s.color + "33" : s.color,
    fill: !!s.fill,
    stepped: !!s.step,
    type: barIdx === 2 ? "bar" : (id === "chTraffic" ? "bar" : "line"),
    borderRadius: 4,
    tension: 0.3
  }));
  charts[id] = new Chart(document.getElementById(id), {
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode:"index", intersect:false },
      plugins: { legend: { labels: { color:"#8b93ab", boxWidth:12 } } },
      scales: {
        x: { ticks:{ color:"#8b93ab", maxRotation:60, maxTicksLimit:15 }, grid:{ color:"#232c47" } },
        y: { ticks:{ color:"#8b93ab" }, grid:{ color:"#232c47" } }
      }
    }
  });
}

async function loadData() {
  const el = document.getElementById("content");
  el.className = "loader";
  el.textContent = "Carregando dados...";
  try {
    const all = await fetchRows();
    if (all.length === 0) {
      el.className = "loader";
      el.textContent = "Nenhum registro encontrado no Supabase.";
      return;
    }
    const rows = filter(all, document.getElementById("period").value);
    build(rows);
  } catch (e) {
    el.className = "loader";
    el.textContent = "Erro ao carregar: " + e.message;
    console.error(e);
  }
}

document.getElementById("period").addEventListener("change", loadData);
loadData();
</script>
</body>
</html>
