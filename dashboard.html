<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>Painel Google Ads — Neurosaber</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b1020;
    --card: #131a2e;
    --border: #232c47;
    --text: #e7eaf3;
    --muted: #8b93ab;
    --primary: #6c5ce7;
    --green: #2ecc71;
    --red: #e74c3c;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }
  header {
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:12px; margin-bottom:20px;
  }
  header h1 { font-size:22px; letter-spacing:.3px; }
  header p { color:var(--muted); font-size:13px; margin-top:4px; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; }
  .controls select, .controls button {
    background:var(--card); color:var(--text);
    border:1px solid var(--border); border-radius:8px;
    padding:8px 14px; font-size:13px; cursor:pointer;
  }
  .controls button:hover { border-color:var(--primary); }
  .grid {
    display:grid; gap:12px;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    margin-bottom:20px;
  }
  .kpi {
    background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:16px;
  }
  .kpi .label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
  .kpi .value { font-size:24px; font-weight:700; margin-top:6px; }
  .kpi .sub { font-size:12px; color:var(--muted); margin-top:4px; }
  .up { color:var(--green); }
  .down { color:var(--red); }
  .charts {
    display:grid; gap:12px;
    grid-template-columns: 1fr 1fr;
    margin-bottom:20px;
  }
  .chart-card {
    background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:16px;
  }
  .chart-card h3 { font-size:14px; margin-bottom:12px; color:var(--muted); }
  .chart-box { position:relative; height:260px; }
  .chart-card.wide .chart-box { height:220px; }
  .chart-card.wide { grid-column: 1 / -1; }
  .table-wrap {
    background:var(--card); border:1px solid var(--border);
    border-radius:12px; overflow:auto;
  }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:10px 14px; text-align:right; white-space:nowrap; }
  th { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px; border-bottom:1px solid var(--border); }
  td:first-child, th:first-child { text-align:left; }
  tr:hover td { background:#182039; }
  .totals { display:flex; gap:24px; flex-wrap:wrap; padding:14px; color:var(--muted); font-size:12px; }
  .totals b { color:var(--text); }
  .loader { text-align:center; padding:60px; color:var(--muted); }
  .section-title {
    font-size:15px; font-weight:600; color:var(--text);
    text-transform:uppercase; letter-spacing:.8px;
    margin:26px 0 12px; padding-bottom:8px;
    border-bottom:1px solid var(--border);
  }
  .section-title small { color:var(--muted); font-weight:400; text-transform:none; letter-spacing:0; margin-left:8px; }
  @media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Painel Google Ads</h1>
    <p>Investimento, faturamento, ROAS e ROI por dia</p>
  </div>
  <div class="controls">
    <select id="period">
      <option value="today">Hoje</option>
      <option value="yesterday">Ontem</option>
      <option value="7">Últimos 7 dias</option>
      <option value="14">Últimos 14 dias</option>
      <option value="30">Últimos 30 dias</option>
      <option value="this-month">Este mês</option>
      <option value="last-month">Mês passado</option>
      <option value="90" selected>Últimos 90 dias</option>
      <option value="all">Todo o período</option>
    </select>
    <button onclick="loadData()">Atualizar</button>
  </div>
</header>

<div id="content" class="loader">Carregando dados...</div>

<script>
const SUPABASE_URL = "https://bbitajwmcapohixocavn.supabase.co";
const API_KEY = "sb_publishable_fNQDTEEbDQvMBbK8M4Dqeg_j-5QF2sS";

const fmtBRL = v => v.toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
const fmtInt = v => v.toLocaleString("pt-BR");
const fmtDate = iso => {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("pt-BR");
};

async function fetchRows() {
  const url = SUPABASE_URL + "/rest/v1/gads_dashboard?select=data,nome_campanha,produto_nome,investimento,faturamento,cliques,impressoes,itens_no_carrinho,quantidade_vendida,roas,roi&order=data.asc";
  const res = await fetch(url, {
    headers: {
      apikey: API_KEY,
      Authorization: "Bearer " + API_KEY,
      Accept: "application/json"
    }
  });
  if (!res.ok) throw new Error("HTTP " + res.status + " — " + await res.text());
  return res.json();
}

async function fetchShopify() {
  const url = SUPABASE_URL + "/rest/v1/shopify_daily?select=data,pedidos,faturamento,clientes_novos,pedidos_canal_google,faturamento_canal_google,ticket_medio&order=data.asc";
  const res = await fetch(url, {
    headers: {
      apikey: API_KEY,
      Authorization: "Bearer " + API_KEY,
      Accept: "application/json"
    }
  });
  if (!res.ok) throw new Error("HTTP " + res.status + " — " + await res.text());
  return res.json();
}

function cards(list) {
  return '<div class="grid">' + list.map(k => {
    const accent = k.c || (k.cls === "up" ? "#2ecc71" : "#e74c3c");
    const valStyle = k.c ? ' style="color:'+k.c+'"' : '';
    return '<div class="kpi" style="border-left:3px solid '+accent+'">'+
      '<div class="label">'+k.label+'</div>'+
      '<div class="value'+(k.cls ? " "+k.cls : "")+'"'+valStyle+'>'+k.value+'</div></div>';
  }).join("") + '</div>';
}

function filter(rows, period) {
  if (period === "all") return rows;
  const today = new Date(); today.setHours(0,0,0,0);
  let start, end = today;
  if (period === "today") {
    start = new Date(today);
  } else if (period === "yesterday") {
    start = new Date(today); start.setDate(start.getDate() - 1);
    end = new Date(start);
  } else if (period === "this-month") {
    start = new Date(today.getFullYear(), today.getMonth(), 1);
  } else if (period === "last-month") {
    start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
    end = new Date(today.getFullYear(), today.getMonth(), 0);
  } else {
    const n = parseInt(period, 10);
    start = new Date(today); start.setDate(start.getDate() - (n - 1));
  }
  return rows.filter(r => {
    const rd = new Date(r.data + "T00:00:00");
    return rd >= start && rd <= end;
  });
}

function build(rows, shopRows) {
  shopRows = shopRows || [];
  const isCamp = r => r.produto_nome === "Geral / Campanha";
  const campRows = rows.filter(isCamp);
  const prodRows = rows.filter(r => !isCamp(r));
  const sum = (arr, f) => arr.reduce((s,r)=>s+Number(f(r)||0),0);

  const inv = sum(campRows, r=>r.investimento);
  const fat = sum(campRows, r=>r.faturamento);
  const cli = sum(campRows, r=>r.cliques);
  const imp = sum(campRows, r=>r.impressoes);
  const ven = sum(campRows, r=>r.quantidade_vendida);
  const venProd = sum(prodRows, r=>r.quantidade_vendida);
  const roas = inv > 0 ? fat / inv : 0;
  const roi = inv > 0 ? ((fat - inv)/inv)*100 : 0;
  const ctr = imp > 0 ? (cli/imp)*100 : 0;
  const cpc = cli > 0 ? inv/cli : 0;

  const byDay = {};
  rows.forEach(r => {
    const d = r.data;
    if (!byDay[d]) byDay[d] = { inv:0, fat:0, cli:0, imp:0, conv:0 };
    if (isCamp(r)) {
      byDay[d].inv += Number(r.investimento||0);
      byDay[d].fat += Number(r.faturamento||0);
      byDay[d].cli += Number(r.cliques||0);
      byDay[d].imp += Number(r.impressoes||0);
      byDay[d].conv += Number(r.quantidade_vendida||0);
    }
  });

  const shopByDay = {};
  shopRows.forEach(r => { shopByDay[r.data] = r; });

  const daysIso = Array.from(new Set([...Object.keys(byDay), ...Object.keys(shopByDay)])).sort();
  const days = daysIso.map(fmtDate);
  const invest = daysIso.map(d => (byDay[d] ? byDay[d].inv : 0));
  const fatura = daysIso.map(d => (byDay[d] ? byDay[d].fat : 0));
  const roasArr = daysIso.map(d => (byDay[d] && byDay[d].inv > 0) ? byDay[d].fat / byDay[d].inv : 0);
  const cliques = daysIso.map(d => (byDay[d] ? byDay[d].cli : 0));
  const impr = daysIso.map(d => (byDay[d] ? byDay[d].imp : 0));
  const fatShopArr = daysIso.map(d => Number(shopByDay[d] ? shopByDay[d].faturamento : 0));

  const sSum = (f) => shopRows.reduce((s,r)=>s+Number(f(r)||0),0);
  const sPedidos = sSum(r=>r.pedidos);
  const sFat = sSum(r=>r.faturamento);
  const sNovos = sSum(r=>r.clientes_novos);
  const sGooglePed = sSum(r=>r.pedidos_canal_google);
  const sGoogleFat = sSum(r=>r.faturamento_canal_google);
  const sTicket = sPedidos > 0 ? sFat / sPedidos : 0;
  const roasReal = inv > 0 ? sGoogleFat / inv : 0;
  const cacReal = sGooglePed > 0 ? inv / sGooglePed : 0;
  const divergencia = fat > 0 ? ((sGoogleFat - fat) / fat) * 100 : 0;
  const hasShopify = shopRows.length > 0;

  const kpis = [
    { label:"Investimento", value:fmtBRL(inv), c:"#6c5ce7" },
    { label:"Faturamento", value:fmtBRL(fat), c:"#2ecc71" },
    { label:"ROAS", value:roas.toFixed(2)+"x", cls: roas>=1?"up":"down" },
    { label:"ROI", value:roi.toFixed(0)+"%", cls: roi>=0?"up":"down" },
    { label:"Conversões", value:fmtInt(ven), c:"#3498db" },
    ...(prodRows.length ? [{ label:"Unidades vendidas", value:fmtInt(venProd), c:"#1abc9c" }] : []),
    { label:"Cliques", value:fmtInt(cli), c:"#f1c40f" },
    { label:"Impressões", value:fmtInt(imp), c:"#8b93ab" },
    { label:"CTR", value:ctr.toFixed(2)+"%", c:"#e84393" },
    { label:"CPC médio", value:fmtBRL(cpc), c:"#e74c3c" }
  ];

  const shopKpis = [
    { label:"Receita Shopify (real)", value:fmtBRL(sFat), c:"#2ecc71" },
    { label:"Pedidos Shopify", value:fmtInt(sPedidos), c:"#3498db" },
    { label:"Ticket médio", value:fmtBRL(sTicket), c:"#1abc9c" },
    { label:"Clientes novos", value:fmtInt(sNovos), c:"#00b894" },
    { label:"Receita origem Google", value:fmtBRL(sGoogleFat), c:"#6c5ce7" },
    { label:"ROAS real (Google)", value:roasReal.toFixed(2)+"x", cls: roasReal>=1?"up":"down" },
    { label:"CAC real (Google)", value:fmtBRL(cacReal), c:"#e84393" },
    { label:"Divergência Ads×Shopify", value:(divergencia>=0?"+":"")+divergencia.toFixed(0)+"%", cls: Math.abs(divergencia)<10?"up":"down" }
  ];

  const crossRows = daysIso.slice().reverse().map(d => {
    const c = byDay[d] || { inv:0, fat:0, conv:0 };
    const s = shopByDay[d] || { pedidos:0, faturamento:0, pedidos_canal_google:0, faturamento_canal_google:0 };
    const fatG = Number(s.faturamento_canal_google || 0);
    const div = c.fat > 0 ? ((fatG - c.fat) / c.fat) * 100 : null;
    return { d, inv:c.inv, conv:c.conv, fatAds:c.fat, ped:s.pedidos, fatShop:s.faturamento, pedG:s.pedidos_canal_google, fatG, div };
  });

  document.getElementById("content").innerHTML =
    '<div class="section-title">Google Ads <small>estimativa do Google</small></div>' +
    cards(kpis) +

    (hasShopify ?
      '<div class="section-title">Shopify × Google Ads <small>caixa real da loja</small></div>' +
      cards(shopKpis) +
      '<div class="table-wrap">' +
        '<table><thead><tr>' +
          '<th>Data</th><th>Invest. Ads</th><th>Conv. Ads</th><th>Receita Ads</th>' +
          '<th>Pedidos</th><th>Receita Shopify</th><th>Origem Google</th><th>Diverg.</th>' +
        '</tr></thead><tbody>' +
        crossRows.map(r =>
          '<tr><td>'+fmtDate(r.d)+'</td>' +
          '<td>'+fmtBRL(r.inv)+'</td>' +
          '<td>'+fmtInt(r.conv)+'</td>' +
          '<td>'+fmtBRL(r.fatAds)+'</td>' +
          '<td>'+fmtInt(r.ped)+'</td>' +
          '<td>'+fmtBRL(Number(r.fatShop))+'</td>' +
          '<td>'+fmtBRL(r.fatG)+'</td>' +
          '<td>'+(r.div===null ? '—' : (r.div>=0?'+':'')+r.div.toFixed(0)+'%')+'</td></tr>'
        ).join("") +
        '</tbody></table>' +
        '<div class="totals"><div>' +
          '<b>Shopify real:</b> '+fmtBRL(sFat)+' em '+fmtInt(sPedidos)+' pedidos &nbsp;·&nbsp; ' +
          '<b>Origem Google:</b> '+fmtBRL(sGoogleFat)+' ('+fmtInt(sGooglePed)+' pedidos) &nbsp;·&nbsp; ' +
          '<b>Ads diz:</b> '+fmtBRL(fat)+' &nbsp;·&nbsp; ' +
          '<b>Divergência:</b> '+(divergencia>=0?'+':'')+divergencia.toFixed(0)+'%' +
        '</div></div>' +
      '</div>'
      : '') +

    '<div class="section-title">Evolução diária</div>' +
    '<div class="charts">' +
      '<div class="chart-card"><h3>Investimento x Faturamento x Receita Shopify (por dia)</h3><div class="chart-box"><canvas id="chTrend"></canvas></div></div>' +
      '<div class="chart-card"><h3>ROAS por dia</h3><div class="chart-box"><canvas id="chRoas"></canvas></div></div>' +
      '<div class="chart-card wide"><h3>Cliques e impressões (por dia)</h3><div class="chart-box"><canvas id="chTraffic"></canvas></div></div>' +
    '</div>' +

    '<div class="section-title">Detalhe por campanha</div>' +
    '<div class="table-wrap">' +
      '<table><thead><tr><th>Data</th><th>Campanha</th><th>Invest.</th><th>Fat.</th><th>ROAS</th><th>ROI</th><th>Cliques</th><th>Impr.</th><th>Conversões</th></tr></thead><tbody>' +
      [...campRows].reverse().map(r =>
        '<tr><td>'+fmtDate(r.data)+'</td><td>'+r.nome_campanha+'</td>'+
        '<td>'+fmtBRL(Number(r.investimento))+'</td><td>'+fmtBRL(Number(r.faturamento))+'</td>'+
        '<td>'+Number(r.roas).toFixed(2)+'x</td><td>'+Number(r.roi).toFixed(0)+'%</td>'+
        '<td>'+fmtInt(r.cliques)+'</td><td>'+fmtInt(r.impressoes)+'</td><td>'+fmtInt(r.quantidade_vendida)+'</td></tr>'
      ).join("") +
      '</tbody></table>' +
      '<div class="totals">'+
        '<div><b>Período:</b> '+days[0]+' a '+days[days.length-1]+' &nbsp;·&nbsp; <b>'+daysIso.length+'</b> dias &nbsp;·&nbsp; <b>'+fmtBRL(inv)+'</b> investido &nbsp;·&nbsp; faturamento <b>'+fmtBRL(fat)+'</b> &nbsp;·&nbsp; <b>'+roas.toFixed(2)+'x</b> ROAS médio</div>'+
      '</div>' +
    '</div>';

  const trendSeries = [
    { label:"Investimento", data:invest, color:"#6c5ce7", fill:true },
    { label:"Faturamento (Google Ads)", data:fatura, color:"#2ecc71", fill:true }
  ];
  if (hasShopify) trendSeries.push({ label:"Receita Shopify (real)", data:fatShopArr, color:"#f1c40f", fill:false });
  makeChart("chTrend", days, trendSeries);
  makeChart("chRoas", days, [
    { label:"ROAS", data:roasArr, color:"#f39c12", fill:false, step:true }
  ]);
  makeChart("chTraffic", days, [
    { label:"Cliques", data:cliques, color:"#f1c40f", fill:false },
    { label:"Impressões", data:impr, color:"#3498db", fill:false }
  ], null, 2);
}

let charts = {};
function makeChart(id, labels, series, yLabel, barIdx) {
  if (charts[id]) charts[id].destroy();
  const datasets = series.map(s => ({
    label: s.label,
    data: s.data,
    borderColor: s.color,
    backgroundColor: s.fill ? s.color + "33" : s.color,
    fill: !!s.fill,
    stepped: !!s.step,
    type: barIdx === 2 ? "bar" : (id === "chTraffic" ? "bar" : "line"),
    borderRadius: 4,
    tension: 0.3
  }));
  charts[id] = new Chart(document.getElementById(id), {
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode:"index", intersect:false },
      plugins: { legend: { labels: { color:"#8b93ab", boxWidth:12 } } },
      scales: {
        x: { ticks:{ color:"#8b93ab", maxRotation:60, maxTicksLimit:15 }, grid:{ color:"#232c47" } },
        y: { ticks:{ color:"#8b93ab" }, grid:{ color:"#232c47" } }
      }
    }
  });
}

async function loadData() {
  const el = document.getElementById("content");
  el.className = "loader";
  el.textContent = "Carregando dados...";
  try {
    const results = await Promise.all([fetchRows(), fetchShopify()]);
    const all = results[0];
    const allShop = results[1];
    const period = document.getElementById("period").value;
    const rows = filter(all, period);
    const shopRows = filter(allShop, period);
    if (rows.length === 0 && shopRows.length === 0) {
      el.className = "loader";
      el.textContent = "Nenhum registro no período selecionado.";
      return;
    }
    build(rows, shopRows);
  } catch (e) {
    el.className = "loader";
    el.textContent = "Erro ao carregar: " + e.message;
    console.error(e);
  }
}

document.getElementById("period").addEventListener("change", loadData);
loadData();
</script>
</body>
</html>
